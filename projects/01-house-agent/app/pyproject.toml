[project]
name = "house-agent"
version = "0.1.0"
description = "LangGraph 智能租房助手：推荐、交互式预约与用户偏好记忆"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "langchain>=1.0.5,<2",
  "langchain-openrouter>=0.2.9,<0.3",
  "langchain-community>=0.4.1,<0.5",
  "langgraph>=1.0.0,<2",
  "langgraph-checkpoint>=3.0.1,<5",
  "langgraph-checkpoint-postgres>=3.0.2,<4",
  "langgraph-cli[inmem]>=0.4.11,<1",
  "python-dotenv>=1.0.1,<2",
  "PyMySQL>=1.1.2,<2",
  "pycryptodome>=3.23.0,<4",
  "SQLAlchemy>=2,<3",
  "typing-extensions>=4.12,<5",
]

[build-system]
requires = ["setuptools>=73", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["py.typed"]
